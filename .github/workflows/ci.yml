# ---------------------------------------------------------------------------
# CI: restore, build (Release) and run the test suite on every push to master.
# Tests are deterministic and offline (fake HttpMessageHandler), so no network.
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build · Test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FastDL.slnx

      - name: Build (Release)
        run: dotnet build FastDL.slnx --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test FastDL.slnx --configuration Release --no-build --verbosity normal

      - name: Vulnerable package scan (informational)
        run: dotnet list FastDL.slnx package --vulnerable --include-transitive || true
